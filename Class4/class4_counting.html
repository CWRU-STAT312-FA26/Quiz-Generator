<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class 4 Practice: Counting Techniques</title>
  <style>
    :root {
      --navy: #17365d;
      --blue: #2f6fb0;
      --pale-blue: #eef5fc;
      --ink: #1f2937;
      --muted: #5f6b7a;
      --success: #16794b;
      --success-bg: #ecf8f1;
      --error: #b42318;
      --error-bg: #fff1f0;
      --paper: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(145deg, #eef4fa 0%, #f8fafc 52%, #edf3f8 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    .page { width: min(820px, calc(100% - 32px)); margin: 36px auto; }

    .hero {
      padding: 28px 30px;
      color: white;
      background: linear-gradient(125deg, var(--navy), #285d93);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 16px 45px rgba(23, 54, 93, 0.16);
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      opacity: 0.86;
    }

    h1 { margin: 0; font-size: clamp(1.65rem, 4vw, 2.3rem); line-height: 1.2; }
    .subtitle { margin: 10px 0 0; opacity: 0.93; }

    main {
      padding: 28px 30px 32px;
      background: var(--paper);
      border-radius: 0 0 18px 18px;
      box-shadow: 0 16px 45px rgba(23, 54, 93, 0.12);
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .progress-track {
      height: 8px;
      margin-bottom: 24px;
      overflow: hidden;
      background: #e8eef4;
      border-radius: 999px;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--blue), #60a5d8);
      transition: width 220ms ease;
    }

    .question-card {
      min-height: 190px;
      padding: 24px;
      background: var(--pale-blue);
      border-left: 5px solid var(--blue);
      border-radius: 10px;
    }

    .question-card h2 { margin: 0 0 10px; color: var(--navy); font-size: 1.08rem; }
    .question-card p { margin: 0; font-size: 1.07rem; }

    .answer-area { margin-top: 22px; }
    .answer-area label { display: block; margin-bottom: 7px; color: var(--navy); font-weight: 750; }

    .answer-area input {
      width: min(100%, 360px);
      min-height: 46px;
      padding: 10px 13px;
      color: var(--ink);
      background: white;
      border: 1.5px solid #b8c6d6;
      border-radius: 8px;
      font: inherit;
      font-size: 1.05rem;
    }

    .answer-area input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(47, 111, 176, 0.14);
    }

    .answer-area input.correct { border-color: var(--success); background: var(--success-bg); }
    .answer-area input.incorrect { border-color: var(--error); background: var(--error-bg); }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

    button {
      min-height: 42px;
      padding: 9px 16px;
      border: 1px solid transparent;
      border-radius: 8px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .primary { color: white; background: var(--navy); }
    .secondary { color: var(--navy); background: white; border-color: #9fb2c8; }
    button:hover { filter: brightness(1.05); }
    button:focus-visible { outline: 3px solid rgba(47, 111, 176, 0.3); outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }

    .feedback {
      display: none;
      margin-top: 20px;
      padding: 17px 19px;
      border-radius: 10px;
    }

    .feedback.show { display: block; }
    .feedback.correct { color: #0d5f3a; background: var(--success-bg); border: 1px solid #abdcc5; }
    .feedback.incorrect { color: #7b251c; background: var(--error-bg); border: 1px solid #f0b6b1; }
    .feedback h3 { margin: 0 0 5px; font-size: 1rem; }
    .feedback p { margin: 4px 0 0; }
    .method { font-weight: 750; }

    .completion {
      display: none;
      padding: 28px;
      text-align: center;
      background: var(--pale-blue);
      border-radius: 12px;
    }

    .completion.show { display: block; }
    .completion h2 { color: var(--navy); margin-top: 0; }
    .completion p { font-size: 1.08rem; }
    .quiz.hidden { display: none; }
    .note { margin: 14px 0 0; color: var(--muted); font-size: 0.88rem; }

    @media (max-width: 620px) {
      .page { width: min(100% - 20px, 820px); margin: 10px auto; }
      .hero, main { padding: 22px 18px; }
      .status-row { align-items: flex-start; flex-direction: column; gap: 3px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <p class="eyebrow">STAT 312 · Class 4 · Section 2</p>
      <h1>Counting Techniques</h1>
      <p class="subtitle">Apply the Multiplication Rule, permutations, and combinations to short-answer problems.</p>
    </header>

    <main>
      <section id="quiz" class="quiz" aria-live="polite">
        <div class="status-row">
          <span id="questionNumber">Question 1 of 15</span>
          <span id="scoreDisplay">Score: 0</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <article class="question-card">
          <h2>Short-Answer Question</h2>
          <p id="questionText"></p>
        </article>

        <div class="answer-area">
          <label for="answerInput">Your answer</label>
          <input id="answerInput" type="text" inputmode="numeric" autocomplete="off" placeholder="Enter a number">
          <p class="note">Enter the final number. Commas are optional.</p>
        </div>

        <div class="actions">
          <button id="checkButton" class="primary" type="button">Check Answer</button>
          <button id="showButton" class="secondary" type="button">Show Solution</button>
          <button id="nextButton" class="secondary" type="button" disabled>Next Question</button>
        </div>

        <div id="feedback" class="feedback" role="status"></div>
      </section>

      <section id="completion" class="completion" aria-live="polite">
        <h2>Practice Round Complete</h2>
        <p id="finalScore"></p>
        <button id="restartButton" class="primary" type="button">Start a New Randomized Round</button>
      </section>
    </main>
  </div>

  <script>
    const questions = [
      {
        text: "A lunch special includes one sandwich, one soup, one drink, and one dessert. There are 4 sandwich choices, 3 soup choices, 4 drink choices, and 2 dessert choices. How many different lunch specials are possible?",
        answer: 96,
        method: "Multiplication Rule",
        solution: "4 × 3 × 4 × 2 = 96."
      },
      {
        text: "A student chooses one shirt from 5 shirts, one pair of pants from 3 pairs, and one pair of shoes from 2 pairs. How many different outfits are possible?",
        answer: 30,
        method: "Multiplication Rule",
        solution: "5 × 3 × 2 = 30."
      },
      {
        text: "A six-sided die is rolled three times. How many ordered sequences of results are possible?",
        answer: 216,
        method: "Multiplication Rule",
        solution: "Each roll has 6 possible results, so 6 × 6 × 6 = 6³ = 216."
      },
      {
        text: "A website design uses one of 6 color schemes, one of 4 fonts, and one of 3 image positions. How many different designs can be created?",
        answer: 72,
        method: "Multiplication Rule",
        solution: "6 × 4 × 3 = 72."
      },
      {
        text: "A four-digit access code is formed using the digits 0 through 9. Repetition is allowed, and a code may begin with 0. How many codes are possible?",
        answer: 10000,
        method: "Multiplication Rule",
        solution: "There are 10 choices for each of 4 positions: 10⁴ = 10,000."
      },
      {
        text: "Seven distinct books are placed in a row on a shelf. In how many different orders can the books be arranged?",
        answer: 5040,
        method: "Permutation",
        solution: "All 7 distinct books are ordered: 7! = 5,040."
      },
      {
        text: "A club with 12 members selects a president, a vice president, and a treasurer. No person may hold more than one office. How many different officer assignments are possible?",
        answer: 1320,
        method: "Permutation",
        solution: "The offices are distinct, so order matters: 12P3 = 12 × 11 × 10 = 1,320."
      },
      {
        text: "A five-digit code is made using each of the digits 1, 2, 3, 4, and 5 exactly once. How many different codes are possible?",
        answer: 120,
        method: "Permutation",
        solution: "Arrange all 5 distinct digits: 5! = 120."
      },
      {
        text: "Ten runners compete in a race. In how many ways can gold, silver, and bronze medals be awarded if there are no ties?",
        answer: 720,
        method: "Permutation",
        solution: "The three medal positions are distinct: 10P3 = 10 × 9 × 8 = 720."
      },
      {
        text: "A printed circuit board has 8 distinct locations. Four distinct components are placed into four different locations, one component per location. How many designs are possible?",
        answer: 1680,
        method: "Permutation",
        solution: "Assign 4 distinct components to 4 of 8 distinct positions: 8P4 = 8 × 7 × 6 × 5 = 1,680."
      },
      {
        text: "A study group of 3 students is selected from a class of 10 students. How many different groups are possible?",
        answer: 120,
        method: "Combination",
        solution: "Group order does not matter: 10C3 = 10!/(3!7!) = 120."
      },
      {
        text: "A pizza shop offers 12 different toppings. How many ways can a customer select 4 different toppings?",
        answer: 495,
        method: "Combination",
        solution: "Topping order does not matter: 12C4 = 495."
      },
      {
        text: "A traveler owns 8 different T-shirts and packs 3 of them. How many different selections are possible?",
        answer: 56,
        method: "Combination",
        solution: "The packing order is irrelevant: 8C3 = 56."
      },
      {
        text: "A committee of 5 people is selected from 13 eligible people. How many different committees can be formed?",
        answer: 1287,
        method: "Combination",
        solution: "Committee order does not matter: 13C5 = 1,287."
      },
      {
        text: "A frozen-yogurt shop offers 15 flavors and 10 toppings. A customer selects 2 different flavors and 3 different toppings. How many unique selections are possible?",
        answer: 12600,
        method: "Combinations and the Multiplication Rule",
        solution: "Choose flavors and toppings independently: 15C2 × 10C3 = 105 × 120 = 12,600."
      }
    ];

    let order = [];
    let position = 0;
    let score = 0;
    let locked = false;

    function shuffle(array) {
      const result = [...array];
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function currentQuestion() { return questions[order[position]]; }

    function parseAnswer(value) {
      const cleaned = value.replace(/,/g, "").trim();
      return /^\d+$/.test(cleaned) ? Number(cleaned) : NaN;
    }

    function renderQuestion() {
      locked = false;
      document.getElementById("questionText").textContent = currentQuestion().text;
      document.getElementById("questionNumber").textContent = `Question ${position + 1} of ${questions.length}`;
      document.getElementById("scoreDisplay").textContent = `Score: ${score}`;
      document.getElementById("progressBar").style.width = `${((position + 1) / questions.length) * 100}%`;
      const input = document.getElementById("answerInput");
      input.value = "";
      input.disabled = false;
      input.className = "";
      document.getElementById("feedback").className = "feedback";
      document.getElementById("feedback").innerHTML = "";
      document.getElementById("checkButton").disabled = false;
      document.getElementById("showButton").disabled = false;
      document.getElementById("nextButton").disabled = true;
      input.focus();
    }

    function finishAttempt(showOnly = false) {
      if (locked) return;
      const q = currentQuestion();
      const input = document.getElementById("answerInput");
      const correct = !showOnly && parseAnswer(input.value) === q.answer;
      if (correct) score += 1;
      locked = true;
      input.disabled = true;
      input.className = correct ? "correct" : "incorrect";
      document.getElementById("scoreDisplay").textContent = `Score: ${score}`;
      document.getElementById("checkButton").disabled = true;
      document.getElementById("showButton").disabled = true;
      document.getElementById("nextButton").disabled = false;

      const feedback = document.getElementById("feedback");
      feedback.className = `feedback show ${correct ? "correct" : "incorrect"}`;
      const heading = showOnly ? `Answer: ${q.answer.toLocaleString()}` : correct ? "Correct." : `Not quite. The answer is ${q.answer.toLocaleString()}.`;
      feedback.innerHTML = `<h3>${heading}</h3><p><span class="method">Method: ${q.method}.</span> ${q.solution}</p>`;
      document.getElementById("nextButton").focus();
    }

    function nextQuestion() {
      if (position === questions.length - 1) {
        document.getElementById("quiz").classList.add("hidden");
        document.getElementById("completion").classList.add("show");
        document.getElementById("finalScore").textContent = `Your score is ${score} out of ${questions.length}.`;
        document.getElementById("restartButton").focus();
        return;
      }
      position += 1;
      renderQuestion();
    }

    function startRound() {
      order = shuffle(questions.map((_, index) => index));
      position = 0;
      score = 0;
      document.getElementById("quiz").classList.remove("hidden");
      document.getElementById("completion").classList.remove("show");
      renderQuestion();
    }

    document.getElementById("checkButton").addEventListener("click", () => finishAttempt(false));
    document.getElementById("showButton").addEventListener("click", () => finishAttempt(true));
    document.getElementById("nextButton").addEventListener("click", nextQuestion);
    document.getElementById("restartButton").addEventListener("click", startRound);
    document.getElementById("answerInput").addEventListener("keydown", event => {
      if (event.key === "Enter" && !locked) finishAttempt(false);
    });

    startRound();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAT 312 - Class 1 Calculation Quiz Generator</title>
  <!-- MathJax 3 -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    :root { 
      --primary: #2c3e50; 
      --accent: #34495e; 
      --blue: #2980b9;
      --bg: #f8f9fa; 
      --card-bg: #ffffff; 
      --correct: #2ed573; 
      --wrong: #ff4757; 
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: var(--bg); 
      color: #2f3542; 
      margin: 0; 
      padding: 24px; 
    }
    .container { 
      max-width: 820px; 
      margin: 0 auto; 
    }
    .header { 
      text-align: center; 
      margin-bottom: 25px; 
    }
    .header h2 {
      margin-bottom: 6px;
      color: var(--primary);
    }
    .header p {
      margin-top: 0;
      color: #57606f;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .tab-btn {
      padding: 10px 16px;
      background: #e2e8f0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      color: #475569;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--blue);
      color: white;
    }
    .tab-btn:hover:not(.active) {
      background: #cbd5e1;
    }
    .card { 
      background: var(--card-bg); 
      padding: 24px 28px; 
      border-radius: 10px; 
      box-shadow: 0 4px 14px rgba(0,0,0,0.06); 
      margin-bottom: 20px; 
      border-left: 5px solid var(--blue); 
    }
    .topic-badge {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--blue);
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .q-prompt {
      font-weight: 600;
      font-size: 1.1rem;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .data-box { 
      background: #f1f5f9; 
      border: 1px solid #e2e8f0;
      padding: 14px 18px; 
      border-radius: 6px; 
      font-family: "SFMono-Regular", Consolas, Menlo, monospace; 
      font-size: 1.15rem; 
      color: #1e293b;
      margin-bottom: 18px; 
      word-break: break-word;
    }
    .input-row { 
      display: flex; 
      gap: 12px; 
      align-items: center; 
      flex-wrap: wrap;
    }
    input[type="number"] { 
      padding: 10px 14px; 
      border: 1.5px solid #cbd5e1; 
      border-radius: 6px; 
      font-size: 1.05rem; 
      width: 190px; 
    }
    .btn { 
      padding: 10px 20px; 
      border: none; 
      background: var(--blue); 
      color: white; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 0.95rem; 
      transition: background 0.2s ease;
    }
    .btn:hover { 
      background: #1c5980; 
    }
    .btn-next {
      background: #475569;
    }
    .btn-next:hover {
      background: #334155;
    }
    .feedback { 
      margin-top: 18px; 
      padding: 14px 18px; 
      border-radius: 6px; 
      display: none; 
      font-size: 0.95rem; 
      line-height: 1.6; 
    }
    .feedback.correct { 
      background: #e8f8f0; 
      color: #1e7e48; 
      border-left: 4px solid var(--correct); 
      display: block; 
    }
    .feedback.wrong { 
      background: #ffebee; 
      color: #b71524; 
      border-left: 4px solid var(--wrong); 
      display: block; 
    }
    .nav-link { 
      display: inline-block; 
      margin-bottom: 16px; 
      color: var(--blue); 
      text-decoration: none; 
      font-weight: 600; 
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="https://cwru-stat312-fa26.github.io/Quiz-Generator/" class="nav-link">← Back to Overview</a>
    <div class="header">
      <h2>STAT 312: Descriptive Statistics</h2>
      <p>Interactive Calculation Quiz (Please round your answers to <strong>3 decimal places</strong>)</p>
    </div>

    <!-- Category Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="setCategory('mean')">Sample Mean (\(\bar{x}\))</button>
      <button class="tab-btn" onclick="setCategory('median')">Sample Median (\(\tilde{x}\))</button>
      <button class="tab-btn" onclick="setCategory('range')">Range (\(R\))</button>
      <button class="tab-btn" onclick="setCategory('variance')">Sample Variance (\(s^2\))</button>
      <button class="tab-btn" onclick="setCategory('sd')">Sample Standard Dev (\(s\))</button>
    </div>

    <!-- Quiz Display Card -->
    <div class="card">
      <div class="topic-badge" id="topicBadge">Sample Mean Practice</div>
      <div class="q-prompt" id="qPrompt">Calculate the Sample Mean (\(\bar{x}\)) for the following dataset:</div>
      <div class="data-box" id="dataBox">Loading dataset...</div>

      <div class="input-row">
        <input type="number" id="userAns" step="0.001" placeholder="Enter answer (3 decimals)">
        <button class="btn" onclick="checkCurrentAnswer()">Submit</button>
        <button class="btn btn-next" onclick="loadRandomQuestion()">Next Random Question ↻</button>
      </div>

      <div class="feedback" id="feedbackBox"></div>
    </div>
  </div>

  <script>
    const quizPool = {
      mean: [
        { data: [12.4, 18.1, 15.6, 24.3, 11.2], target: 16.320, sol: "$$\\bar{x} = \\frac{12.4 + 18.1 + 15.6 + 24.3 + 11.2}{5} = \\frac{81.6}{5} = 16.320$$" },
        { data: [5.2, 10.8, 15.1, 20.4, 25.7, 30.3], target: 17.917, sol: "$$\\bar{x} = \\frac{107.5}{6} \\approx 17.917$$" },
        { data: [8.15, 12.40, 7.30, 9.85, 14.10, 11.25, 9.60], target: 10.379, sol: "$$\\bar{x} = \\frac{72.65}{7} \\approx 10.379$$" },
        { data: [22.1, 28.4, 35.2, 15.7, 40.0, 20.6, 25.8, 31.3], target: 27.388, sol: "$$\\bar{x} = \\frac{219.1}{8} \\approx 27.388$$" },
        { data: [4.2, 6.5, 8.1, 9.4, 11.0, 12.3, 14.7, 16.2, 19.8], target: 11.356, sol: "$$\\bar{x} = \\frac{102.2}{9} \\approx 11.356$$" },
        { data: [10.5, 15.2, 20.1, 25.4, 30.0, 35.8, 40.2, 45.1, 50.7, 55.3], target: 32.830, sol: "$$\\bar{x} = \\frac{328.3}{10} = 32.830$$" },
        { data: [1.55, 2.45, 3.65, 4.85, 8.10], target: 4.120, sol: "$$\\bar{x} = \\frac{20.60}{5} = 4.120$$" },
        { data: [100.2, 104.5, 98.1, 102.7, 96.4, 106.8], target: 101.450, sol: "$$\\bar{x} = \\frac{608.7}{6} = 101.450$$" },
        { data: [3.1, 7.4, 8.2, 5.5, 12.8, 1.9, 6.3], target: 6.457, sol: "$$\\bar{x} = \\frac{45.2}{7} \\approx 6.457$$" },
        { data: [14.2, 14.8, 16.1, 18.5, 28.3, 12.0, 20.4, 22.7], target: 18.375, sol: "$$\\bar{x} = \\frac{147.0}{8} = 18.375$$" }
      ],
      median: [
        { data: [78.2, 85.1, 92.4, 64.0, 88.7, 70.3], target: 81.650, sol: "Sorted: [64.0, 70.3, 78.2, 85.1, 88.7, 92.4] ($n=6$).<br>$$\\tilde{x} = \\frac{78.2 + 85.1}{2} = 81.650$$" },
        { data: [15.3, 3.8, 27.1, 9.4, 12.6], target: 12.600, sol: "Sorted: [3.8, 9.4, 12.6, 15.3, 27.1] ($n=5$).<br>Middle value: $$\\tilde{x} = 12.600$$" },
        { data: [4.1, 1.9, 8.3, 9.5, 2.7, 6.4, 11.2], target: 6.400, sol: "Sorted: [1.9, 2.7, 4.1, 6.4, 8.3, 9.5, 11.2] ($n=7$).<br>Middle value: $$\\tilde{x} = 6.400$$" },
        { data: [14.5, 19.2, 12.1, 25.8, 30.0, 16.4, 11.7, 20.3], target: 17.800, sol: "Sorted: [11.7, 12.1, 14.5, 16.4, 19.2, 20.3, 25.8, 30.0] ($n=8$).<br>$$\\tilde{x} = \\frac{16.4 + 19.2}{2} = 17.800$$" },
        { data: [45.2, 12.8, 67.4, 23.1, 89.0, 34.6, 56.3, 78.9, 90.5], target: 56.300, sol: "Sorted: [12.8, 23.1, 34.6, 45.2, 56.3, 67.4, 78.9, 89.0, 90.5] ($n=9$).<br>Middle value: $$\\tilde{x} = 56.300$$" },
        { data: [5.4, 18.2, 22.9, 10.1, 40.7, 31.3, 15.8, 27.0, 35.2, 12.6], target: 20.550, sol: "Sorted: [5.4, 10.1, 12.6, 15.8, 18.2, 22.9, 27.0, 31.3, 35.2, 40.7] ($n=10$).<br>$$\\tilde{x} = \\frac{18.2 + 22.9}{2} = 20.550$$" },
        { data: [2.15, 5.40, 1.82, 3.94, 7.21], target: 3.940, sol: "Sorted: [1.82, 2.15, 3.94, 5.40, 7.21] ($n=5$).<br>Middle value: $$\\tilde{x} = 3.940$$" },
        { data: [33.4, 12.9, 45.1, 29.8, 18.2, 52.6], target: 31.600, sol: "Sorted: [12.9, 18.2, 29.8, 33.4, 45.1, 52.6] ($n=6$).<br>$$\\tilde{x} = \\frac{29.8 + 33.4}{2} = 31.600$$" },
        { data: [105.2, 98.4, 112.7, 89.1, 120.3, 101.6, 95.0], target: 101.600, sol: "Sorted: [89.1, 95.0, 98.4, 101.6, 105.2, 112.7, 120.3] ($n=7$).<br>Middle value: $$\\tilde{x} = 101.600$$" },
        { data: [6.3, 18.7, 4.1, 22.5, 10.8, 14.2, 8.9, 16.4], target: 12.500, sol: "Sorted: [4.1, 6.3, 8.9, 10.8, 14.2, 16.4, 18.7, 22.5] ($n=8$).<br>$$\\tilde{x} = \\frac{10.8 + 14.2}{2} = 12.500$$" }
      ],
      range: [
        { data: [10.54, 14.21, 8.93, 15.67, 11.38], target: 6.740, sol: "$$R = x_{\\max} - x_{\\min} = 15.67 - 8.93 = 6.740$$" },
        { data: [45.1, 82.7, 19.3, 63.8, 91.4, 34.2], target: 72.100, sol: "$$R = 91.4 - 19.3 = 72.100$$" },
        { data: [7.25, 19.80, 2.15, 31.40, 14.65, 28.90, 10.30], target: 29.250, sol: "$$R = 31.40 - 2.15 = 29.250$$" },
        { data: [250.4, 110.1, 480.9, 320.5, 190.2, 410.7, 150.8, 300.0], target: 370.800, sol: "$$R = 480.9 - 110.1 = 370.800$$" },
        { data: [12.8, 48.3, 24.1, 36.7, 18.9, 55.2, 62.4, 30.5, 41.0], target: 49.600, sol: "$$R = 62.4 - 12.8 = 49.600$$" },
        { data: [100.5, 105.2, 98.7, 102.1, 110.8, 95.4, 108.9, 101.3, 99.0, 115.6], target: 20.200, sol: "$$R = 115.6 - 95.4 = 20.200$$" },
        { data: [3.45, 8.91, 1.20, 14.78, 6.32], target: 13.580, sol: "$$R = 14.78 - 1.20 = 13.580$$" },
        { data: [55.12, 62.84, 58.30, 71.05, 49.60, 66.40], target: 21.450, sol: "$$R = 71.05 - 49.60 = 21.450$$" },
        { data: [1.25, 3.80, 0.45, 2.10, 4.15, 1.90, 0.80], target: 3.700, sol: "$$R = 4.15 - 0.45 = 3.700$$" },
        { data: [9.4, 81.2, 27.5, 3.1, 45.8, 63.0, 18.6, 72.9], target: 78.100, sol: "$$R = 81.2 - 3.1 = 78.100$$" }
      ],
      variance: [
        { 
          data: [12.4, 15.8, 10.2, 14.6, 17.0], 
          target: 7.400, 
          sol: "1. $\\bar{x} = 14.000$<br>2. $\\sum(x_i - \\bar{x})^2 = (-1.6)^2 + (1.8)^2 + (-3.8)^2 + (0.6)^2 + (3.0)^2 = 2.56 + 3.24 + 14.44 + 0.36 + 9.00 = 29.60$<br>3. $$s^2 = \\frac{29.60}{5-1} = 7.400$$" 
        },
        { 
          data: [4.5, 7.2, 3.8, 8.1, 5.4, 6.0], 
          target: 2.627, 
          sol: "1. $\\bar{x} = \\frac{35.0}{6} \\approx 5.833$<br>2. $\\sum(x_i - \\bar{x})^2 \\approx 13.1333$<br>3. $$s^2 = \\frac{13.1333}{6-1} \\approx 2.627$$" 
        },
        { 
          data: [23.1, 25.4, 21.8, 28.0, 24.7, 22.5, 26.3], 
          target: 4.930, 
          sol: "1. $\\bar{x} = \\frac{171.8}{7} \\approx 24.543$<br>2. $\\sum(x_i - \\bar{x})^2 \\approx 29.5771$<br>3. $$s^2 = \\frac{29.5771}{7-1} \\approx 4.930$$" 
        },
        { 
          data: [102.5, 98.0, 105.2, 101.4, 96.8, 104.1, 99.5, 100.5], 
          target: 8.400, 
          sol: "1. $\\bar{x} = 101.000$<br>2. $\\sum(x_i - 101.0)^2 = 2.25 + 9.00 + 17.64 + 0.16 + 17.64 + 9.61 + 2.25 + 0.25 = 58.80$<br>3. $$s^2 = \\frac{58.80}{8-1} = 8.400$$" 
        },
        { 
          data: [1.25, 2.40, 1.80, 3.10, 2.05], 
          target: 0.476, 
          sol: "1. $\\bar{x} = 2.120$<br>2. $\\sum(x_i - 2.12)^2 = 0.7569 + 0.0784 + 0.1024 + 0.9604 + 0.0049 = 1.9030$<br>3. $$s^2 = \\frac{1.9030}{5-1} \\approx 0.476$$" 
        },
        { 
          data: [8.6, 9.4, 7.8, 11.2, 10.5, 8.9], 
          target: 1.580, 
          sol: "1. $\\bar{x} = 9.400$<br>2. $\\sum(x_i - 9.4)^2 = 0.64 + 0.00 + 2.56 + 3.24 + 1.21 + 0.25 = 7.90$<br>3. $$s^2 = \\frac{7.90}{6-1} = 1.580$$" 
        },
        { 
          data: [52.0, 48.5, 55.2, 51.4, 49.8, 56.1, 53.0], 
          target: 7.488, 
          sol: "1. $\\bar{x} = \\frac{366.0}{7} \\approx 52.286$<br>2. $\\sum(x_i - \\bar{x})^2 \\approx 44.9286$<br>3. $$s^2 = \\frac{44.9286}{7-1} \\approx 7.488$$" 
        },
        { 
          data: [3.12, 4.55, 2.80, 5.10, 3.90, 4.20], 
          target: 0.752, 
          sol: "1. $\\bar{x} = 3.945$<br>2. $\\sum(x_i - 3.945)^2 = 0.6806 + 0.3660 + 1.3110 + 1.3340 + 0.0020 + 0.0650 = 3.75875$<br>3. $$s^2 = \\frac{3.75875}{6-1} \\approx 0.752$$" 
        },
        { 
          data: [15.2, 18.7, 12.4, 14.9, 16.8, 19.1, 13.5, 17.0, 15.6], 
          target: 4.961, 
          sol: "1. $\\bar{x} = \\frac{143.2}{9} \\approx 15.911$<br>2. $\\sum(x_i - \\bar{x})^2 \\approx 39.6889$<br>3. $$s^2 = \\frac{39.6889}{9-1} \\approx 4.961$$" 
        },
        { 
          data: [7.5, 8.2, 6.9, 9.4, 8.8, 7.1, 8.0, 9.1, 6.5, 8.5], 
          target: 0.958, 
          sol: "1. $\\bar{x} = 8.000$<br>2. $\\sum(x_i - 8.0)^2 = 0.25 + 0.04 + 1.21 + 1.96 + 0.64 + 0.81 + 0.00 + 1.21 + 2.25 + 0.25 = 8.62$<br>3. $$s^2 = \\frac{8.62}{10-1} \\approx 0.958$$" 
        }
      ],
      sd: [
        { 
          data: [12.4, 15.8, 10.2, 14.6, 17.0], 
          target: 2.720, 
          sol: "1. $s^2 = 7.400$<br>2. $$s = \\sqrt{7.400} \\approx 2.720$$" 
        },
        { 
          data: [4.5, 7.2, 3.8, 8.1, 5.4, 6.0], 
          target: 1.621, 
          sol: "1. $s^2 \\approx 2.627$<br>2. $$s = \\sqrt{2.627} \\approx 1.621$$" 
        },
        { 
          data: [23.1, 25.4, 21.8, 28.0, 24.7, 22.5, 26.3], 
          target: 2.220, 
          sol: "1. $s^2 \\approx 4.930$<br>2. $$s = \\sqrt{4.930} \\approx 2.220$$" 
        },
        { 
          data: [102.5, 98.0, 105.2, 101.4, 96.8, 104.1, 99.5, 100.5], 
          target: 2.898, 
          sol: "1. $s^2 = 8.400$<br>2. $$s = \\sqrt{8.400} \\approx 2.898$$" 
        },
        { 
          data: [1.25, 2.40, 1.80, 3.10, 2.05], 
          target: 0.690, 
          sol: "1. $s^2 \\approx 0.476$<br>2. $$s = \\sqrt{0.476} \\approx 0.690$$" 
        },
        { 
          data: [8.6, 9.4, 7.8, 11.2, 10.5, 8.9], 
          target: 1.257, 
          sol: "1. $s^2 = 1.580$<br>2. $$s = \\sqrt{1.580} \\approx 1.257$$" 
        },
        { 
          data: [52.0, 48.5, 55.2, 51.4, 49.8, 56.1, 53.0], 
          target: 2.736, 
          sol: "1. $s^2 \\approx 7.488$<br>2. $$s = \\sqrt{7.488} \\approx 2.736$$" 
        },
        { 
          data: [3.12, 4.55, 2.80, 5.10, 3.90, 4.20], 
          target: 0.867, 
          sol: "1. $s^2 \\approx 0.752$<br>2. $$s = \\sqrt{0.752} \\approx 0.867$$" 
        },
        { 
          data: [15.2, 18.7, 12.4, 14.9, 16.8, 19.1, 13.5, 17.0, 15.6], 
          target: 2.227, 
          sol: "1. $s^2 \\approx 4.961$<br>2. $$s = \\sqrt{4.961} \\approx 2.227$$" 
        },
        { 
          data: [7.5, 8.2, 6.9, 9.4, 8.8, 7.1, 8.0, 9.1, 6.5, 8.5], 
          target: 0.979, 
          sol: "1. $s^2 \\approx 0.958$<br>2. $$s = \\sqrt{0.958} \\approx 0.979$$" 
        }
      ]
    };

    let currentCategory = 'mean';
    let currentQ = null;

    const titles = {
      mean: { badge: "Sample Mean Practice", prompt: "Calculate the Sample Mean (\\(\\bar{x}\\)) for the following dataset:" },
      median: { badge: "Sample Median Practice", prompt: "Calculate the Sample Median (\\(\\tilde{x}\\)) for the following dataset:" },
      range: { badge: "Sample Range Practice", prompt: "Calculate the Sample Range (\\(R\\)) for the following dataset:" },
      variance: { badge: "Sample Variance Practice", prompt: "Calculate the Sample Variance (\\(s^2\\)) for the following dataset (divide by \\(n-1\\)):" },
      sd: { badge: "Sample Standard Deviation Practice", prompt: "Calculate the Sample Standard Deviation (\\(s\\)) for the following dataset:" }
    };

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      loadRandomQuestion();
    }

    function loadRandomQuestion() {
      const list = quizPool[currentCategory];
      const randIdx = Math.floor(Math.random() * list.length);
      currentQ = list[randIdx];

      document.getElementById('topicBadge').innerText = titles[currentCategory].badge;
      document.getElementById('qPrompt').innerHTML = titles[currentCategory].prompt;
      document.getElementById('dataBox').innerText = `Dataset: [ ${currentQ.data.join(', ')} ]`;
      
      document.getElementById('userAns').value = '';
      const fb = document.getElementById('feedbackBox');
      fb.style.display = 'none';
      fb.innerHTML = '';

      if (window.MathJax) {
        MathJax.typesetPromise([document.getElementById('qPrompt')]);
      }
    }

    function checkCurrentAnswer() {
      if (!currentQ) return;
      const input = document.getElementById('userAns').value;
      const val = parseFloat(input);
      const fb = document.getElementById('feedbackBox');

      if (isNaN(val)) {
        fb.className = 'feedback wrong';
        fb.innerHTML = '<strong>Please enter a valid numeric value.</strong>';
        fb.style.display = 'block';
        return;
      }

      // Strict tolerance of +/- 0.001
      const isCorrect = Math.abs(val - currentQ.target) <= 0.001;
      fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
      fb.innerHTML = (isCorrect ? '<strong>✓ Correct!</strong><br>' : '<strong>✗ Incorrect. (Target: ' + currentQ.target.toFixed(3) + ')</strong><br>') + currentQ.sol;
      fb.style.display = 'block';

      if (window.MathJax) {
        MathJax.typesetPromise([fb]);
      }
    }

    window.onload = function() {
      loadRandomQuestion();
    };
  </script>
</body>
</html>
